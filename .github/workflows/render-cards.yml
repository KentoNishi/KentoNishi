name: render cards

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: render-cards
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, intl
          tools: composer:v2

      - name: Clone renderers
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/card-renderers"
          git clone --depth=1 https://github.com/anuraghazra/github-readme-stats.git "$RUNNER_TEMP/card-renderers/github-readme-stats"
          git clone --depth=1 https://github.com/DenverCoder1/github-readme-streak-stats.git "$RUNNER_TEMP/card-renderers/github-readme-streak-stats"

      - name: Render GitHub stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/card-renderers/github-readme-stats"
          npm ci
          cd "$GITHUB_WORKSPACE"
          node scripts/render-github-stats.mjs "$RUNNER_TEMP/card-renderers/github-readme-stats" "$GITHUB_WORKSPACE/assets/github-stats.svg"

      - name: Render GitHub streak
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/card-renderers/github-readme-streak-stats"
          composer install --no-dev --prefer-dist --no-interaction --no-progress
          cat > router.php <<'PHP'
          <?php
          $_SERVER["TOKEN"] = getenv("TOKEN") ?: "";
          $_SERVER["DISABLE_CACHE"] = "true";
          chdir(__DIR__ . "/src");
          require __DIR__ . "/src/index.php";
          PHP
          php -S 127.0.0.1:8099 router.php > "$RUNNER_TEMP/streak-stats.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl -fsS "http://127.0.0.1:8099/?user=KentoNishi&hide_border=true&theme=dark" -o "$GITHUB_WORKSPACE/assets/github-streak.svg"; then
              break
            fi
            sleep 1
          done

          test -s "$GITHUB_WORKSPACE/assets/github-streak.svg"
          grep -q "<svg" "$GITHUB_WORKSPACE/assets/github-streak.svg"
          if grep -q "Error lable\\|Something went wrong\\|Missing token\\|User not in whitelist\\|\\.env was not found" "$GITHUB_WORKSPACE/assets/github-streak.svg"; then
            cat "$RUNNER_TEMP/streak-stats.log"
            exit 1
          fi

      - name: Commit rendered assets
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md assets/github-stats.svg assets/github-streak.svg; then
            echo "No card changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/github-stats.svg assets/github-streak.svg
          git commit -m "update profile cards"
          git push
