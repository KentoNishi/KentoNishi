name: render cards

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"
      timezone: America/New_York

permissions:
  contents: write

concurrency:
  group: render-cards
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Choose render date
        id: render_date
        run: |
          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import sys
          from datetime import datetime, time, timedelta, timezone
          from zoneinfo import ZoneInfo

          eastern = ZoneInfo("America/New_York")
          now = datetime.now(eastern)
          as_of = datetime.combine(now.date() - timedelta(days=1), time(23, 59, 59), eastern)
          print(f"as_of_date={as_of.date().isoformat()}")
          print(f"as_of_utc={as_of.astimezone(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')}")
          print(f"Run: {now.isoformat()}; cutoff: {as_of.isoformat()}", file=sys.stderr)
          PY

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, intl
          tools: composer:v2

      - name: Check out stats renderer
        uses: actions/checkout@v6
        with:
          repository: anuraghazra/github-readme-stats
          ref: 54a7985aeefda00d5eadb55b80c17c7f976c37d2
          path: renderers/stats
          persist-credentials: false

      - name: Check out streak renderer
        uses: actions/checkout@v6
        with:
          repository: DenverCoder1/github-readme-streak-stats
          ref: 9202e37665889fdb42d9a7df8501c1800acf761d
          path: renderers/streak
          persist-credentials: false

      - name: Render GitHub stats
        id: stats
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARD_AS_OF: ${{ steps.render_date.outputs.as_of_utc }}
          FETCH_MULTI_PAGE_STARS: "true"
        run: |
          set -euo pipefail
          npm ci --prefix renderers/stats --omit=dev --ignore-scripts
          node scripts/render-github-stats.mjs "$GITHUB_WORKSPACE/renderers/stats" "$RUNNER_TEMP/github-stats.svg"

      - name: Render GitHub streak
        id: streak
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARD_AS_OF_DATE: ${{ steps.render_date.outputs.as_of_date }}
        run: |
          set -euo pipefail
          composer install --working-dir=renderers/streak --no-dev --prefer-dist --no-interaction --no-progress
          php scripts/render-github-streak.php "$GITHUB_WORKSPACE/renderers/streak" "$RUNNER_TEMP/github-streak.svg"

      - name: Commit successful cards
        env:
          STATS_RESULT: ${{ steps.stats.outcome }}
          STREAK_RESULT: ${{ steps.streak.outcome }}
          CARD_AS_OF_DATE: ${{ steps.render_date.outputs.as_of_date }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          from pathlib import Path
          import shutil
          import xml.etree.ElementTree as ET

          for card in ("stats", "streak"):
              if os.environ[f"{card.upper()}_RESULT"] != "success":
                  continue
              source = Path(os.environ["RUNNER_TEMP"]) / f"github-{card}.svg"
              if ET.parse(source).getroot().tag != "{http://www.w3.org/2000/svg}svg":
                  raise SystemExit(f"Invalid SVG: {source}")
              shutil.copyfile(source, Path("assets") / source.name)
          PY
          echo "Through $CARD_AS_OF_DATE: stats=$STATS_RESULT, streak=$STREAK_RESULT" >> "$GITHUB_STEP_SUMMARY"
          git add assets/github-stats.svg assets/github-streak.svg
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "update profile cards through $CARD_AS_OF_DATE"
            git push
          fi
          # Publish a successful card even if the other failed, but keep the run red.
          test "$STATS_RESULT" = success
          test "$STREAK_RESULT" = success
